name: Deploy the backend
on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/db/**"
      - "docker/Dockerfile.backend"
      - ".github/workflows/cd_backend.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: adarshanatia/trello_backend:${{ github.sha }}

      - name: Update manifest with new image tag
        run: |
          sed -i "s|image: adarshanatia/trello_backend:.*|image: adarshanatia/trello_backend:${{ github.sha }}|" k8s/backend.yml

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend.yml
          git commit -m "cd: deploy backend ${{ github.sha }}" || exit 0
          git pull --rebase
          git push
