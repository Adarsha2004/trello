name: Deploy the websocket server
on:
  push:
    branches: [ main ]
    paths:
      - "apps/websocket/**"
      - "packages/auth/**"
      - "docker/Dockerfile.ws"
      - ".github/workflows/cd_ws.yml"
jobs: 
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.ws
          push: true
          tags: adarshanatia/trello_websocket:${{ github.sha }}

      - name: Update manifest with new image tag
        run: |
          sed -i "s|image: adarshanatia/trello_websocket:.*|image: adarshanatia/trello_websocket:${{ github.sha }}|" k8s/websocket.yml

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/websocket.yml
          git commit -m "cd: deploy websocket ${{ github.sha }}" || exit 0
          git pull --rebase
          git push
