apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: adarshanatia/trello_backend:f7cf3f7eefa8f69aff9c5765be43fcdf6e2de968
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: trello-secrets
          env:
            - name: BACKEND_PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
